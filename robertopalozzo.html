<!DOCTYPE html>

  {
    title: "Ancient survivors",
    body: "Cockroach ancestors have existed for hundreds of millions of years.",
  },
  {
    title: "Built for darkness",
    body: "Most species are nocturnal and spend daylight hours hidden in cracks, crevices, leaf litter, or other sheltered places.",
  },
  {
    title: "More than pests",
    body: "Thousands of cockroach species exist worldwide, and only a relatively small number commonly live around people.",
  },
  {
    title: "Natural recyclers",
    body: "In wild ecosystems, many species help break down decaying plant material and return nutrients to the environment.",
  },
];

const ANATOMY = [
  { value: 6, label: "legs" },
  { value: 2, label: "long antennae" },
  { value: 3, label: "main body regions" },
];

function CockroachPage() {
  return (
    <div className="min-h-screen scroll-smooth bg-stone-950 text-stone-100">

        <section className="relative overflow-hidden border-b border-amber-900/30 bg-gradient-to-br from-stone-950 via-amber-950/40 to-stone-900 px-6 py-24">
          <div className="mx-auto grid max-w-6xl items-center gap-12 md:grid-cols-2">
            <div>
              <p className="mb-4 text-sm font-bold uppercase tracking-[0.3em] text-amber-400">
                Insect profile
              </p>
              <h1 className="break-words text-5xl font-black tracking-tight sm:text-6xl md:text-8xl">
                Cockroaches
              </h1>
              <p className="mt-6 max-w-xl text-xl leading-relaxed text-stone-300">
